<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="description" content="Mi Taller — tus pociones guardadas y textos personalizados en Minerva's Experiments."/>
<title>Mi Taller — Minerva's Experiments</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#fbcb70"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Minerva"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="icon" type="image/svg+xml" href="icon.svg"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@400;500&family=Work+Sans:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-primary-fixed-variant": "#5d4200",
          "tertiary": "#decafb",
          "on-tertiary": "#382950",
          "surface-variant": "#363245",
          "inverse-surface": "#e6dff7",
          "secondary-container": "#5e4204",
          "surface-container-lowest": "#0f0c1c",
          "on-secondary-fixed": "#271900",
          "surface-container-high": "#2b2839",
          "primary": "#fbcb70",
          "error": "#ffb4ab",
          "on-secondary-fixed-variant": "#5e4204",
          "on-error-container": "#ffdad6",
          "on-error": "#690005",
          "on-surface-variant": "#d2c5b2",
          "outline-variant": "#4e4637",
          "primary-container": "#ddb058",
          "on-tertiary-fixed": "#221439",
          "surface-bright": "#3a3749",
          "secondary-fixed-dim": "#eac079",
          "on-tertiary-fixed-variant": "#4f3f68",
          "on-primary": "#412d00",
          "secondary-fixed": "#ffdea9",
          "primary-fixed-dim": "#eec066",
          "on-secondary": "#422c00",
          "on-primary-fixed": "#271900",
          "on-secondary-container": "#d7af6a",
          "inverse-primary": "#7b5801",
          "surface": "#141122",
          "tertiary-fixed-dim": "#d2beee",
          "surface-container-low": "#1c192a",
          "surface-container-highest": "#363245",
          "error-container": "#93000a",
          "tertiary-container": "#c1aede",
          "tertiary-fixed": "#ecdcff",
          "background": "#141122",
          "inverse-on-surface": "#312e40",
          "outline": "#9b8f7e",
          "secondary": "#eac079",
          "surface-tint": "#eec066",
          "primary-fixed": "#ffdea5",
          "on-background": "#e6dff7",
          "surface-container": "#201d2f",
          "on-surface": "#e6dff7",
          "on-tertiary-container": "#4f4069",
          "surface-dim": "#141122",
          "on-primary-container": "#5e4300"
        },
        fontFamily: {
          "headline": ["Noto Serif", "serif"],
          "body": ["Inter", "sans-serif"],
          "label": ["Work Sans", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
      },
    },
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .glass-artifact {
    backdrop-filter: blur(12px);
    background: rgba(43, 40, 57, 0.7);
  }
  body {
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  main {
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
  }
</style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary">

<!-- Header -->
<header class="sticky top-0 z-50 border-b border-outline-variant/20 bg-gradient-to-b from-surface-container-low to-surface shadow-[0_4px_20px_rgba(0,0,0,0.6)]">
  <div class="grid grid-cols-[1fr_auto_1fr] items-center w-full px-4 pt-4 pb-2 max-w-screen-xl mx-auto">
    <div></div>
    <a href="index.html" class="flex items-center gap-3 hover:opacity-80 active:opacity-60 transition-opacity">
      <span class="material-symbols-outlined text-primary text-2xl">science</span>
      <h1 class="text-2xl font-headline font-bold text-primary drop-shadow-[0_2px_4px_rgba(251,203,112,0.3)] tracking-tight whitespace-nowrap">Minerva's Experiments</h1>
    </a>
    <div id="auth-zone" class="flex justify-end items-center gap-1"></div>
  </div>
  <nav class="flex justify-center max-w-screen-xl mx-auto">
    <a href="index.html" class="font-label text-[10px] uppercase tracking-widest px-5 py-2.5 border-b-2 border-transparent text-on-surface-variant/50 hover:text-on-surface transition-colors">Generador</a>
    <a href="biblioteca.html" class="font-label text-[10px] uppercase tracking-widest px-5 py-2.5 border-b-2 border-transparent text-on-surface-variant/50 hover:text-on-surface transition-colors">Biblioteca</a>
    <a href="taller.html" class="font-label text-[10px] uppercase tracking-widest px-5 py-2.5 border-b-2 border-primary text-primary transition-colors">Mi Taller</a>
  </nav>
</header>

<main class="min-h-screen max-w-lg mx-auto px-4 py-8 flex flex-col gap-6">

  <!-- Page title -->
  <div class="text-center space-y-2 mt-4">
    <div class="flex items-center justify-center gap-2 text-primary">
      <span class="material-symbols-outlined text-2xl">home_repair_service</span>
      <h2 class="font-headline text-2xl font-bold tracking-tight">Mi Taller</h2>
    </div>
    <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Tu colección personal</p>
  </div>

  <!-- Guest state -->
  <div id="guest-section" style="display:none" class="rounded-xl border border-outline-variant/15 glass-artifact shadow-2xl px-6 py-10 flex flex-col items-center gap-4 text-center">
    <span class="material-symbols-outlined text-primary/40 text-4xl">lock</span>
    <p class="font-label text-sm text-on-surface-variant">Necesitas una cuenta para ver tu taller.</p>
    <a href="login.html" class="font-label text-[11px] uppercase tracking-widest text-primary border border-primary/30 rounded-lg px-4 py-2 hover:bg-primary/10 transition-colors">
      Iniciar sesión
    </a>
  </div>

  <!-- Taller content -->
  <div id="taller-content" style="display:none" class="flex flex-col gap-8">

    <!-- Mi Alias -->
    <div class="flex flex-col gap-2">
      <div class="px-1">
        <span class="font-label text-[10px] uppercase tracking-widest text-primary font-semibold">Mi Alias</span>
      </div>
      <div class="rounded-xl border border-outline-variant/15 glass-artifact shadow-2xl px-5 py-4">
        <div id="alias-view" class="flex items-center gap-3">
          <span id="alias-display" class="flex-1 font-headline text-base text-on-surface"></span>
          <button id="alias-roll-view-btn" title="Alias aleatorio" class="text-on-surface-variant/50 hover:text-primary border border-outline-variant/30 hover:border-primary/40 rounded-lg p-1.5 transition-colors flex items-center">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" aria-hidden="true">
              <!-- Left face -->
              <path d="M2 6 L10 10 L10 18 L2 14Z" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
              <!-- Right face -->
              <path d="M10 10 L18 6 L18 14 L10 18Z" fill="currentColor" fill-opacity="0.11" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
              <!-- Top face -->
              <path d="M10 2 L18 6 L10 10 L2 6Z" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
              <!-- Top face: 1 dot -->
              <circle cx="10" cy="6" r="1.4" fill="currentColor"/>
              <!-- Right face: 2 dots -->
              <circle cx="15.2" cy="10.2" r="1.05" fill="currentColor" fill-opacity="0.85"/>
              <circle cx="12.8" cy="14.5" r="1.05" fill="currentColor" fill-opacity="0.85"/>
              <!-- Left face: 3 dots -->
              <circle cx="4.8" cy="9.5" r="0.9" fill="currentColor" fill-opacity="0.6"/>
              <circle cx="6" cy="12.5" r="0.9" fill="currentColor" fill-opacity="0.6"/>
              <circle cx="4.8" cy="15.5" r="0.9" fill="currentColor" fill-opacity="0.6"/>
            </svg>
          </button>
          <button id="alias-edit-btn" title="Cambiar alias" class="text-on-surface-variant/50 hover:text-primary border border-outline-variant/30 hover:border-primary/40 rounded-lg p-1.5 transition-colors flex items-center">
            <span class="material-symbols-outlined" style="font-size:18px">edit</span>
          </button>
        </div>
        <div id="alias-edit" style="display:none" class="flex items-center gap-2">
          <input id="alias-input" type="text" maxlength="40" class="flex-1 bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-3 py-1.5 text-on-surface text-sm font-body focus:outline-none focus:border-primary/50"/>
          <button id="alias-roll-edit-btn" class="shrink-0 font-label text-[9px] uppercase tracking-widest text-on-surface-variant/50 hover:text-primary border border-outline-variant/30 hover:border-primary/40 rounded-lg px-2.5 py-1 transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined" style="font-size:12px">casino</span>
          </button>
          <button id="alias-save-btn" class="font-label text-[9px] uppercase tracking-widest text-primary border border-primary/30 rounded-lg px-2.5 py-1 hover:bg-primary/10 transition-colors">Guardar</button>
          <button id="alias-cancel-btn" class="font-label text-[9px] uppercase tracking-widest text-on-surface-variant/40 border border-outline-variant/20 rounded-lg px-2.5 py-1 hover:text-on-surface transition-colors">Cancelar</button>
        </div>
        <p id="alias-feedback" class="font-label text-[11px] mt-1"></p>
      </div>
    </div>

    <!-- Añadir texto personalizado -->
    <div class="flex flex-col gap-2">
      <div class="px-1">
        <span class="font-label text-[10px] uppercase tracking-widest text-primary font-semibold">Añadir texto</span>
      </div>
      <div class="rounded-xl overflow-hidden border border-outline-variant/15 glass-artifact shadow-2xl px-6 py-5 space-y-4">
        <div class="space-y-2">
          <label for="custom-category" class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Categoría</label>
          <select id="custom-category" class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-3 py-2 text-on-surface text-sm font-body focus:outline-none focus:border-primary/50">
            <option value="mainEffects">Efecto Principal</option>
            <option value="sideEffects">Efecto Secundario</option>
            <option value="containers">Recipiente</option>
            <option value="labels">Etiqueta</option>
            <option value="appearance">Color</option>
            <option value="appearance2">Apariencia</option>
            <option value="tasteAndSmell">Sabor / Olor</option>
            <option value="textures">Textura</option>
            <option value="duration">Duración</option>
          </select>
        </div>
        <div class="space-y-2">
          <label for="custom-text-input" class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Texto</label>
          <div class="relative">
            <textarea id="custom-text-input" rows="3" class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-3 pt-2 pb-11 text-on-surface text-sm font-body resize-none focus:outline-none focus:border-primary/50 placeholder:text-on-surface-variant/30"></textarea>
            <div class="absolute bottom-2 right-1 pointer-events-none select-none">
              <svg width="30" height="30" viewBox="0 0 30 30">
                <circle cx="15" cy="15" r="12" fill="none" stroke="#4e4637" stroke-width="2" opacity="0.4"/>
                <circle id="custom-text-counter-ring" cx="15" cy="15" r="12" fill="none" stroke="#d2c5b2" stroke-width="2" stroke-linecap="round" stroke-dasharray="75.40" stroke-dashoffset="75.40" transform="rotate(-90 15 15)"/>
                <text id="custom-text-counter" x="15" y="15" text-anchor="middle" dominant-baseline="central" font-size="9" font-family="Work Sans, sans-serif" font-weight="500" fill="#d2c5b2"></text>
              </svg>
            </div>
          </div>
        </div>
        <button id="custom-text-submit" class="w-full py-2.5 bg-primary/20 border border-primary/30 text-primary rounded-lg font-label text-sm uppercase tracking-widest hover:bg-primary/30 active:scale-95 transition-all disabled:opacity-40 disabled:pointer-events-none">
          Añadir
        </button>
        <p id="custom-text-feedback" class="font-label text-[11px] text-center text-on-surface-variant min-h-[1rem]"></p>
      </div>
    </div>

    <!-- Mis textos -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between px-1">
        <span class="font-label text-[10px] uppercase tracking-widest text-primary font-semibold">Mis Textos</span>
        <div class="flex items-center gap-3">
          <span id="texts-count" class="font-label text-[10px] text-on-surface-variant"></span>
          <select id="texts-category" class="bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-2 py-1 text-on-surface text-xs font-body focus:outline-none focus:border-primary/50">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
      <div id="texts-section" class="rounded-xl overflow-hidden border border-outline-variant/15 glass-artifact shadow-2xl"></div>
    </div>

    <!-- Siguiendo -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between px-1">
        <span class="font-label text-[10px] uppercase tracking-widest text-primary font-semibold">Siguiendo</span>
        <span id="follows-count" class="font-label text-[10px] text-on-surface-variant"></span>
      </div>
      <div id="follows-section" class="rounded-xl overflow-hidden border border-outline-variant/15 glass-artifact shadow-2xl"></div>
    </div>

  </div>

</main>

<!-- Footer -->
<footer class="bg-surface-container-lowest py-6 mt-10 border-t border-outline-variant/10">
  <p class="text-center font-label text-[10px] text-on-surface-variant/30 tracking-widest uppercase">Minerva's Experiments</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="data/potion-data.js"></script>
<script src="auth.js"></script>
<script src="taller.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
